<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能 BOM 比較器</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 相關套件 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 載入 SheetJS (用於解析 Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    /* 簡易動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    /* 自訂捲軸樣式 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9; 
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // --- 圖示元件 ---
    const ArrowRightLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>;
    const FileMinus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/></svg>;
    const FilePlus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 12v6"/></svg>;
    const Upload = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
    const CheckCircle2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
    const Inbox = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>;
    const Layers = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 17 22 12"/></svg>;
    const AlertTriangle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;
    const GitCommit = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/></svg>;
    const Plus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const Minus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="M5 12h14"/></svg>;
    const Loader = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;

    // --- 主程式 ---
    function BOMComparator() {
      const [bom1Text, setBom1Text] = useState('');
      const [bom2Text, setBom2Text] = useState('');
      const [results, setResults] = useState(null);
      // 新增狀態：是否保留原始順序 (預設為 true)
      const [preserveOrder, setPreserveOrder] = useState(true);
      // 新增狀態：是否正在比對中 (Loading 狀態)
      const [isComparing, setIsComparing] = useState(false);
      
      const fileInput1Ref = useRef(null);
      const fileInput2Ref = useRef(null);

      // 處理檔案上傳
      const handleFileUpload = (e, setBomText) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!window.XLSX) {
          alert('Excel 模組尚未載入完成，請確認網路連線或稍候再試。');
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const parsedText = window.XLSX.utils.sheet_to_csv(worksheet, { FS: '\t' });
            setBomText(parsedText);
          } catch (error) {
            console.error(error);
            alert('檔案解析失敗，請確認是否為有效的 Excel 或 CSV 檔案。');
          }
        };
        reader.readAsArrayBuffer(file);
        
        e.target.value = null;
      };

      // 解析 BOM 文字
      const parseBOM = (text) => {
        const lines = text.split('\n');
        const map = new Map();
        const list = [];

        lines.forEach((line, index) => {
          if (!line.trim()) return;

          const separator = line.includes('\t') ? '\t' : ',';
          let cols = [];
          
          if (separator === '\t') {
            cols = line.split('\t');
          } else {
            cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          }
          
          // 徹底去除可能因 CSV 匯出而產生的頭尾雙引號
          let rawPartString = (cols[0] || '').replace(/^"|"$/g, '').trim();
          const description = cols[1] || '';
          const qty = cols[2] || '';

          const isSecondSource = rawPartString.includes('S:');

          // ==========================================
          // 核心修復：無視括弧內的序號數字
          // ==========================================
          let cleanPartNumber = rawPartString
            .replace(/\(\s*\d+\s*\)/g, '')  // 1. 徹底拔除所有 (數字) 序號，例如 (70), (100)
            .replace(/S:/gi, '')            // 2. 移除 S: 標記
            .replace(/^[\s|.\-]+/, '')      // 3. 移除開頭殘留的階層符號 (如 | 或 -) 讓顯示更美觀
            .trim();

          // 產生最終比對用的 Key (只保留英數字元並轉大寫)
          const compareKey = cleanPartNumber.replace(/[^A-Za-z0-9]/g, '').toUpperCase();

          if (compareKey) {
            const itemObj = {
              rawStr: rawPartString.trim(),
              displayPart: cleanPartNumber,
              description: description.replace(/^"|"$/g, '').trim(), 
              qty: qty.replace(/^"|"$/g, '').trim(),
              isSecondSource: isSecondSource,
              lineNum: index + 1,
              compareKey: compareKey
            };

            // 儲存為 Map 以供群組統計
            if (!map.has(compareKey)) {
              map.set(compareKey, []);
            }
            map.get(compareKey).push(itemObj);
            
            // 同時儲存為 List 以保留原始順序
            list.push(itemObj);
          }
        });
        return { map, list };
      };

      // 執行比對
      const handleCompare = () => {
        if (!bom1Text.trim() || !bom2Text.trim()) {
          alert('請輸入或匯入兩份 BOM 資料');
          return;
        }

        // 清空舊結果並開啟 Loading 狀態
        setResults(null);
        setIsComparing(true);

        // 加上延遲，模擬「認真比對」的視覺效果 (1.5 秒)
        setTimeout(() => {
          const parsed1 = parseBOM(bom1Text);
          const parsed2 = parseBOM(bom2Text);
          
          const map1 = parsed1.map;
          const map2 = parsed2.map;
          const list1 = parsed1.list;
          const list2 = parsed2.list;

          const onlyInBom1 = [];
          const onlyInBom2 = [];
          const qtyDiff = []; 
          const common = [];  

          // 1. 群組統計分析 (計算卡片與摘要表格用)
          map1.forEach((items1, key) => {
            if (map2.has(key)) {
              const items2 = map2.get(key);
              const qty1Str = items1.map(i => i.qty).sort().join(',');
              const qty2Str = items2.map(i => i.qty).sort().join(',');

              if (qty1Str === qty2Str) {
                common.push({ key, bom1: items1, bom2: items2 });
              } else {
                qtyDiff.push({ key, bom1: items1, bom2: items2 });
              }
            } else {
              items1.forEach(item => onlyInBom1.push({ key, ...item }));
            }
          });

          map2.forEach((items2, key) => {
            if (!map1.has(key)) {
              items2.forEach(item => onlyInBom2.push({ key, ...item }));
            }
          });

          // 2. 順序保留的差異對比演算法 (Unified View Diff Algorithm)
          const unifiedBOM = [];
          let i = 0; // list1 pointer
          let j = 0; // list2 pointer

          while (i < list1.length || j < list2.length) {
            if (i < list1.length && j < list2.length && list1[i].compareKey === list2[j].compareKey) {
              // 順序與料號均匹配
              const status = list1[i].qty === list2[j].qty ? 'UNCHANGED' : 'QTY_DIFF';
              unifiedBOM.push({
                ...list1[i],
                status,
                bom1Line: list1[i].lineNum,
                bom2Line: list2[j].lineNum,
                bom2Qty: list2[j].qty,
              });
              i++;
              j++;
            } else {
              // 遇到差異，往後尋找 (Lookahead Window: 500行) 來判斷是新增還是刪除
              let foundInList2 = -1;
              if (i < list1.length) {
                for (let k = j; k < Math.min(j + 500, list2.length); k++) {
                  if (list1[i].compareKey === list2[k].compareKey) { foundInList2 = k; break; }
                }
              }
              
              let foundInList1 = -1;
              if (j < list2.length) {
                for (let k = i; k < Math.min(i + 500, list1.length); k++) {
                  if (list2[j].compareKey === list1[k].compareKey) { foundInList1 = k; break; }
                }
              }

              if (foundInList2 !== -1 && foundInList1 === -1) {
                // 在 BOM 2 後方有找到，但 BOM 1 沒有 -> 當前 j 屬於 BOM 2 新增的
                unifiedBOM.push({ ...list2[j], status: 'ADDED', bom1Line: '-', bom2Line: list2[j].lineNum });
                j++;
              } else if (foundInList1 !== -1 && foundInList2 === -1) {
                // 在 BOM 1 後方有找到，但 BOM 2 沒有 -> 當前 i 屬於 BOM 1 被刪除的
                unifiedBOM.push({ ...list1[i], status: 'REMOVED', bom1Line: list1[i].lineNum, bom2Line: '-' });
                i++;
              } else if (foundInList1 !== -1 && foundInList2 !== -1) {
                // 雙方後方都有找到，以距離近的優先處置
                if (foundInList1 - i < foundInList2 - j) {
                  unifiedBOM.push({ ...list1[i], status: 'REMOVED', bom1Line: list1[i].lineNum, bom2Line: '-' });
                  i++;
                } else {
                  unifiedBOM.push({ ...list2[j], status: 'ADDED', bom1Line: '-', bom2Line: list2[j].lineNum });
                  j++;
                }
              } else {
                // 都沒找到，先將清空當前的 i (標示為刪除)，再清空當前的 j (標示為新增)
                if (i < list1.length) {
                  unifiedBOM.push({ ...list1[i], status: 'REMOVED', bom1Line: list1[i].lineNum, bom2Line: '-' });
                  i++;
                } else {
                  unifiedBOM.push({ ...list2[j], status: 'ADDED', bom1Line: '-', bom2Line: list2[j].lineNum });
                  j++;
                }
              }
            }
          }

          setResults({
            onlyInBom1,
            onlyInBom2,
            qtyDiff,
            common,
            unifiedBOM,
            totalBom1: map1.size,
            totalBom2: map2.size
          });

          // 關閉 Loading 狀態
          setIsComparing(false);
        }, 1500);
      };

      const commonCount = results ? results.common.reduce((acc, curr) => acc + curr.bom1.length, 0) : 0;
      const qtyDiffCount = results ? results.qtyDiff.length : 0;

      // ==========================================
      // 動態決定「完整變更歷程」要顯示的資料
      // ==========================================
      let displayUnifiedBOM = [];
      if (results) {
        if (preserveOrder) {
          // 勾選保留原始順序：使用演算法跑出來的完整對比序列
          displayUnifiedBOM = [...results.unifiedBOM];
        } else {
          // 不保留原始順序：忽略順序差異，只萃取真正的「刪除」、「新增」與「用量差異」
          results.onlyInBom1.forEach(item => {
            displayUnifiedBOM.push({ ...item, status: 'REMOVED', bom1Line: item.lineNum, bom2Line: '-' });
          });
          results.onlyInBom2.forEach(item => {
            displayUnifiedBOM.push({ ...item, status: 'ADDED', bom1Line: '-', bom2Line: item.lineNum });
          });
          results.qtyDiff.forEach(group => {
            const item1 = group.bom1[0] || group.bom2[0];
            displayUnifiedBOM.push({
              ...item1,
              status: 'QTY_DIFF',
              bom1Line: group.bom1.map(i => i.lineNum).join(', '),
              bom2Line: group.bom2.map(i => i.lineNum).join(', '),
              qty: group.bom1.map(i => i.qty).join(', '),
              bom2Qty: group.bom2.map(i => i.qty).join(', ')
            });
          });
          // 依料號字母排序，方便集中檢視
          displayUnifiedBOM.sort((a, b) => a.compareKey.localeCompare(b.compareKey));
        }
      }

      return (
        <div className="min-h-screen p-6">
          <div className="max-w-[1500px] mx-auto space-y-6">
            
            {/* Header */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center">
              <h1 className="text-3xl font-bold text-slate-800 flex items-center justify-center gap-3">
                <ArrowRightLeft className="w-8 h-8 text-blue-600" />
                智能 BOM 比較器
              </h1>
              <p className="text-slate-500 mt-2">
                自動忽略空格與特殊符號差異，精準比對料號、屬性與<strong className="text-blue-600">用量(QTY)</strong>，並支援<strong className="text-green-600">順序還原</strong>。
              </p>
            </div>

            {/* Input Section */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* BOM 1 Input */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col">
                <div className="flex justify-between items-center mb-3">
                  <h2 className="text-lg font-semibold text-slate-700 flex items-center gap-2">
                    <FileMinus className="w-5 h-5 text-red-500" /> BOM 1 (舊版/基準)
                  </h2>
                  <button 
                    onClick={() => fileInput1Ref.current.click()}
                    className="flex items-center gap-1 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md transition"
                  >
                    <Upload className="w-4 h-4" /> 匯入 Excel/CSV
                  </button>
                  <input 
                    type="file" 
                    accept=".csv,.xlsx,.xls,.txt" 
                    ref={fileInput1Ref} 
                    onChange={(e) => handleFileUpload(e, setBom1Text)} 
                    className="hidden" 
                  />
                </div>
                <textarea
                  value={bom1Text}
                  onChange={(e) => setBom1Text(e.target.value)}
                  placeholder="請在此貼上 BOM 1 的內容 (可直接從 Excel 複製貼上)..."
                  className="flex-1 w-full min-h-[200px] p-3 text-sm font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y custom-scrollbar"
                ></textarea>
              </div>

              {/* BOM 2 Input */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col">
                <div className="flex justify-between items-center mb-3">
                  <h2 className="text-lg font-semibold text-slate-700 flex items-center gap-2">
                    <FilePlus className="w-5 h-5 text-green-500" /> BOM 2 (新版/比對)
                  </h2>
                  <button 
                    onClick={() => fileInput2Ref.current.click()}
                    className="flex items-center gap-1 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md transition"
                  >
                    <Upload className="w-4 h-4" /> 匯入 Excel/CSV
                  </button>
                  <input 
                    type="file" 
                    accept=".csv,.xlsx,.xls,.txt" 
                    ref={fileInput2Ref} 
                    onChange={(e) => handleFileUpload(e, setBom2Text)} 
                    className="hidden" 
                  />
                </div>
                <textarea
                  value={bom2Text}
                  onChange={(e) => setBom2Text(e.target.value)}
                  placeholder="請在此貼上 BOM 2 的內容 (可直接從 Excel 複製貼上)..."
                  className="flex-1 w-full min-h-[200px] p-3 text-sm font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y custom-scrollbar"
                ></textarea>
              </div>
            </div>

            {/* Action Button */}
            <div className="flex justify-center">
              <button 
                onClick={handleCompare}
                disabled={isComparing}
                className={`text-white text-lg font-medium px-8 py-3 rounded-full shadow-lg transition-all flex items-center gap-2 ${isComparing ? 'bg-blue-400 cursor-wait' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-xl'}`}
              >
                {isComparing ? (
                  <><Loader className="w-5 h-5 animate-spin" /> 深度比對中...</>
                ) : (
                  <><ArrowRightLeft className="w-5 h-5" /> 開始比對差異</>
                )}
              </button>
            </div>

            {/* Loading 狀態顯示區塊 */}
            {isComparing && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-16 flex flex-col items-center justify-center animate-fade-in mt-6">
                <Loader className="w-14 h-14 text-blue-600 animate-spin mb-4" />
                <h3 className="text-2xl font-bold text-slate-700">正在進行深度比對...</h3>
                <p className="text-slate-500 mt-2">系統正在解析料號、過濾特殊符號、比對用量與還原階層順序</p>
              </div>
            )}

            {/* Results Section */}
            {results && !isComparing && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 animate-fade-in">
                <h2 className="text-2xl font-bold text-slate-800 mb-6 border-b pb-4">比對結果分析</h2>
                
                {/* Summary Cards */}
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 text-center">
                    <div className="text-xs text-slate-500 mb-1">BOM 1 總料號</div>
                    <div className="text-2xl font-bold text-slate-700">{results.totalBom1}</div>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 text-center">
                    <div className="text-xs text-slate-500 mb-1">BOM 2 總料號</div>
                    <div className="text-2xl font-bold text-slate-700">{results.totalBom2}</div>
                  </div>
                  <div className="bg-red-50 p-4 rounded-lg border border-red-200 text-center shadow-sm">
                    <div className="text-xs text-red-600 mb-1 font-semibold">BOM 1 獨有 (減少)</div>
                    <div className="text-2xl font-bold text-red-600">{results.onlyInBom1.length}</div>
                  </div>
                  <div className="bg-green-50 p-4 rounded-lg border border-green-200 text-center shadow-sm">
                    <div className="text-xs text-green-600 mb-1 font-semibold">BOM 2 獨有 (新增)</div>
                    <div className="text-2xl font-bold text-green-600">{results.onlyInBom2.length}</div>
                  </div>
                  <div className="bg-orange-50 p-4 rounded-lg border border-orange-300 text-center shadow-sm">
                    <div className="text-xs text-orange-600 mb-1 font-semibold">用量差異 (Qty)</div>
                    <div className="text-2xl font-bold text-orange-600">{qtyDiffCount}</div>
                  </div>
                  <div className="bg-slate-100 p-4 rounded-lg border border-slate-300 text-center shadow-sm">
                    <div className="text-xs text-slate-600 mb-1 font-semibold">無差異 (皆有)</div>
                    <div className="text-2xl font-bold text-slate-700">{commonCount}</div>
                  </div>
                </div>

                {/* 1. Qty Diff Table (用量有差異) */}
                {results.qtyDiff.length > 0 && (
                  <div className="border border-orange-300 rounded-lg overflow-hidden bg-white shadow-sm mb-6">
                    <div className="bg-orange-50 p-3.5 border-b border-orange-300 flex items-center justify-between">
                      <div className="flex items-center gap-2 text-orange-800 font-bold">
                        <AlertTriangle className="w-5 h-5" /> 
                        用量差異明細 (兩版皆有該料號，但數量不同)
                      </div>
                      <span className="bg-orange-200 text-orange-900 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-orange-300">
                        共 {qtyDiffCount} 筆
                      </span>
                    </div>
                    
                    <div className="overflow-x-auto max-h-[400px] overflow-y-auto custom-scrollbar">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-orange-100/50 text-orange-900 font-semibold sticky top-0 shadow-sm z-10 border-b border-orange-200">
                          <tr>
                            <th className="p-3 w-20">屬性</th>
                            <th className="p-3 w-44">顯示料號</th>
                            <th className="p-3">描述 (Description)</th>
                            <th className="p-3 w-28 text-center text-red-600 border-l border-orange-200">BOM 1 用量</th>
                            <th className="p-3 w-28 text-center text-green-600 border-l border-orange-200">BOM 2 用量</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-orange-100">
                          {results.qtyDiff.map((group, idx) => {
                            const firstItem = group.bom1[0] || group.bom2[0];
                            const qty1Str = group.bom1.map(i => i.qty).join(', ');
                            const qty2Str = group.bom2.map(i => i.qty).join(', ');

                            return (
                              <tr key={`qtydiff-${idx}`} className="hover:bg-orange-50/50 transition-colors">
                                <td className="p-3">
                                  {firstItem.isSecondSource ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-purple-100 text-purple-700 border border-purple-200">S: 替代</span> : <span className="px-2 py-0.5 rounded text-xs text-slate-500 bg-slate-100">主料</span>}
                                </td>
                                <td className="p-3 font-mono font-medium text-slate-800" title={`原始格式: ${firstItem.rawStr}`}>{firstItem.displayPart}</td>
                                <td className="p-3 text-slate-600 line-clamp-3 text-xs leading-relaxed" title={firstItem.description}>{firstItem.description}</td>
                                <td className="p-3 text-center font-bold text-red-600 bg-red-50/30 border-l border-orange-100 text-lg">{qty1Str}</td>
                                <td className="p-3 text-center font-bold text-green-600 bg-green-50/30 border-l border-orange-100 text-lg">{qty2Str}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 2. 獨立料號 Tables (紅綠區塊) */}
                {(results.onlyInBom1.length > 0 || results.onlyInBom2.length > 0) && (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start mb-6">
                    {/* BOM 1 Only Table */}
                    <div className="border border-red-200 rounded-lg overflow-hidden bg-white shadow-sm">
                      <div className="bg-red-50/80 p-3.5 border-b border-red-200 flex items-center justify-between">
                        <div className="flex items-center gap-2 text-red-700 font-bold"><FileMinus className="w-5 h-5" />BOM 1 獨有料件 (減少的料)</div>
                        <span className="bg-red-200 text-red-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">共 {results.onlyInBom1.length} 筆</span>
                      </div>
                      <div className="overflow-x-auto max-h-[400px] overflow-y-auto custom-scrollbar">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-50 text-slate-600 font-semibold sticky top-0 shadow-sm z-10">
                            <tr><th className="p-3 w-20">屬性</th><th className="p-3 w-44">顯示料號</th><th className="p-3">描述</th><th className="p-3 w-16 text-center">Qty</th></tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {results.onlyInBom1.map((item, idx) => (
                              <tr key={`bom1-${idx}`} className="hover:bg-red-50/40 transition-colors">
                                <td className="p-3">{item.isSecondSource ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-purple-100 text-purple-700">S: 替代</span> : <span className="px-2 py-0.5 rounded text-xs text-slate-500 bg-slate-100">主料</span>}</td>
                                <td className="p-3 font-mono font-medium text-slate-800">{item.displayPart}</td>
                                <td className="p-3 text-slate-600 text-xs">{item.description}</td>
                                <td className="p-3 text-center">{item.qty}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* BOM 2 Only Table */}
                    <div className="border border-green-200 rounded-lg overflow-hidden bg-white shadow-sm">
                      <div className="bg-green-50/80 p-3.5 border-b border-green-200 flex items-center justify-between">
                        <div className="flex items-center gap-2 text-green-700 font-bold"><FilePlus className="w-5 h-5" />BOM 2 獨有料件 (新增的料)</div>
                        <span className="bg-green-200 text-green-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">共 {results.onlyInBom2.length} 筆</span>
                      </div>
                      <div className="overflow-x-auto max-h-[400px] overflow-y-auto custom-scrollbar">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-50 text-slate-600 font-semibold sticky top-0 shadow-sm z-10">
                            <tr><th className="p-3 w-20">屬性</th><th className="p-3 w-44">顯示料號</th><th className="p-3">描述</th><th className="p-3 w-16 text-center">Qty</th></tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {results.onlyInBom2.map((item, idx) => (
                              <tr key={`bom2-${idx}`} className="hover:bg-green-50/40 transition-colors">
                                <td className="p-3">{item.isSecondSource ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-purple-100 text-purple-700">S: 替代</span> : <span className="px-2 py-0.5 rounded text-xs text-slate-500 bg-slate-100">主料</span>}</td>
                                <td className="p-3 font-mono font-medium text-slate-800">{item.displayPart}</td>
                                <td className="p-3 text-slate-600 text-xs">{item.description}</td>
                                <td className="p-3 text-center">{item.qty}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* 3. 無差異料件明細表 */}
                {results.common.length > 0 && (
                  <div className="border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm mt-6">
                    <div className="bg-slate-100 p-3.5 border-b border-slate-300 flex items-center justify-between">
                      <div className="flex items-center gap-2 text-slate-700 font-bold">
                        <Layers className="w-5 h-5" /> 無差異料件明細 (兩份 BOM 皆有且用量相同)
                      </div>
                      <span className="bg-slate-200 text-slate-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-slate-300">
                        共 {commonCount} 筆
                      </span>
                    </div>
                    <div className="overflow-x-auto max-h-[400px] overflow-y-auto custom-scrollbar">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 text-slate-600 font-semibold sticky top-0 shadow-sm z-10 border-b border-slate-200">
                          <tr><th className="p-3 w-20">屬性</th><th className="p-3 w-44">顯示料號</th><th className="p-3">描述 (Description)</th><th className="p-3 w-16 text-center">Qty</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {results.common.map((group) => group.bom1.map((item, subIdx) => (
                            <tr key={`common-${item.compareKey}-${subIdx}`} className="hover:bg-slate-50/80 transition-colors">
                              <td className="p-3">{item.isSecondSource ? <span className="px-2 py-0.5 rounded text-xs font-bold bg-purple-100 text-purple-700">S: 替代</span> : <span className="px-2 py-0.5 rounded text-xs text-slate-500 bg-slate-100">主料</span>}</td>
                              <td className="p-3 font-mono font-medium text-slate-800">{item.displayPart}</td>
                              <td className="p-3 text-slate-600 text-xs">{item.description}</td>
                              <td className="p-3 text-center">{item.qty}</td>
                            </tr>
                          )))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* ========================================================= */}
                {/* 4. 完整 BOM 變更歷程 (Unified View)  */}
                {/* ========================================================= */}
                <div className="border border-slate-800 rounded-lg overflow-hidden bg-white shadow-lg mt-12 animate-fade-in ring-2 ring-slate-800/10">
                  <div className="bg-slate-800 p-4 border-b border-slate-700 flex flex-wrap gap-4 items-center justify-between text-white shadow-inner">
                    <div className="flex items-center gap-3 font-bold text-lg">
                      <GitCommit className="w-6 h-6 text-blue-400" />
                      完整 BOM 變更歷程
                    </div>
                    
                    {/* 控制列 (勾選框與統計) */}
                    <div className="flex items-center gap-4">
                      <label className="flex items-center gap-2 text-sm font-medium cursor-pointer text-slate-200 hover:text-white transition-colors bg-slate-700/50 hover:bg-slate-700 px-3 py-1.5 rounded-md border border-slate-600">
                        <input 
                          type="checkbox" 
                          className="w-4 h-4 cursor-pointer accent-blue-500"
                          checked={preserveOrder}
                          onChange={(e) => setPreserveOrder(e.target.checked)}
                        />
                        包含原始順序
                      </label>
                      <span className="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-full font-semibold border border-slate-600">
                        顯示筆數：{displayUnifiedBOM.length} 筆
                      </span>
                    </div>
                  </div>
                  
                  <div className="overflow-x-auto max-h-[800px] overflow-y-auto custom-scrollbar bg-[#f8fafc]">
                    <table className="w-full text-left text-sm font-mono border-collapse">
                      <thead className="bg-slate-200 text-slate-700 font-bold sticky top-0 shadow-sm z-10 border-b-2 border-slate-300">
                        <tr>
                          <th className="p-3 w-12 text-center" title="變更狀態">狀態</th>
                          <th className="p-3 w-16 text-center text-slate-500 border-r border-slate-300" title="BOM 1 原行號"># 舊</th>
                          <th className="p-3 w-16 text-center text-slate-500 border-r border-slate-300" title="BOM 2 新行號"># 新</th>
                          <th className="p-3 w-16 text-center">屬性</th>
                          <th className="p-3 w-48">顯示料號</th>
                          <th className="p-3">描述 (Description)</th>
                          <th className="p-3 w-20 text-center border-l border-slate-300">BOM 1 數量</th>
                          <th className="p-3 w-20 text-center border-l border-slate-300">BOM 2 數量</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {displayUnifiedBOM.map((item, idx) => {
                          // 定義各狀態的樣式
                          let rowClass = "";
                          let statusIcon = null;
                          let qty1Display = item.qty;
                          let qty2Display = item.bom2Qty || item.qty;
                          
                          if (item.status === 'REMOVED') {
                            rowClass = "bg-red-50/70 text-red-900";
                            statusIcon = <Minus className="w-5 h-5 text-red-600 mx-auto" />;
                            qty2Display = <span className="text-slate-400">-</span>;
                          } else if (item.status === 'ADDED') {
                            rowClass = "bg-green-50/70 text-green-900";
                            statusIcon = <Plus className="w-5 h-5 text-green-600 mx-auto" />;
                            qty1Display = <span className="text-slate-400">-</span>;
                          } else if (item.status === 'QTY_DIFF') {
                            rowClass = "bg-orange-50/80 text-orange-900 font-medium";
                            statusIcon = <AlertTriangle className="w-4 h-4 text-orange-600 mx-auto" />;
                          } else {
                            rowClass = "hover:bg-slate-100 transition-colors text-slate-700";
                            statusIcon = <span className="text-slate-300">&nbsp;</span>;
                          }

                          return (
                            <tr key={`unified-${item.compareKey}-${idx}`} className={rowClass}>
                              <td className="p-2 border-r border-slate-200">{statusIcon}</td>
                              <td className="p-2 text-center text-slate-400 border-r border-slate-200 text-xs">
                                {item.bom1Line}
                              </td>
                              <td className="p-2 text-center text-slate-400 border-r border-slate-200 text-xs">
                                {item.bom2Line}
                              </td>
                              <td className="p-2 text-center">
                                {item.isSecondSource ? <span className="text-[10px] px-1 py-0.5 rounded border border-current opacity-70">S: 替代</span> : ''}
                              </td>
                              <td className={`p-2 font-bold ${item.status === 'REMOVED' ? 'line-through opacity-70' : ''}`}>
                                {item.displayPart}
                              </td>
                              <td className={`p-2 text-xs leading-tight ${item.status === 'REMOVED' ? 'line-through opacity-70' : 'opacity-90'}`}>
                                {item.description}
                              </td>
                              
                              {/* 數量比對區域 */}
                              <td className={`p-2 text-center border-l border-slate-200 ${item.status === 'QTY_DIFF' ? 'text-red-600 font-bold bg-red-100/50' : ''}`}>
                                {qty1Display}
                              </td>
                              <td className={`p-2 text-center border-l border-slate-200 ${item.status === 'QTY_DIFF' ? 'text-green-600 font-bold bg-green-100/50' : ''}`}>
                                {qty2Display}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BOMComparator />);
  </script>
</body>
</html>
